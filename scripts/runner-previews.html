<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Original runner portrait renderer</title></head>
  <body>
    <script type="module">
      import * as THREE from 'three';
      import { createSchoolboy } from '/src/art/Schoolboy.js';
      import { CHARACTERS } from '/src/game/CharacterCatalog.js';
      import { disposeBatchedGeometry } from '/src/art/StaticBatcher.js';

      const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, preserveDrawingBuffer: true });
      renderer.setSize(280, 340, false);
      renderer.setPixelRatio(1);
      renderer.setClearColor(0x000000, 0);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.12;
      renderer.shadowMap.enabled = false;
      const scene = new THREE.Scene();
      scene.add(new THREE.HemisphereLight(0xc5d8ff, 0x49362f, 2.1));
      const key = new THREE.DirectionalLight(0xffd7ad, 3.0);
      key.position.set(-3, 6, 7);
      scene.add(key);
      const rim = new THREE.DirectionalLight(0x72b9db, 1.6);
      rim.position.set(4, 3, -4);
      scene.add(rim);
      const camera = new THREE.OrthographicCamera(-1.25, 1.25, 1.65, -1.65, 0.1, 30);
      camera.position.set(2.4, 1.55, 7);
      camera.lookAt(0, 1.3, 0);

      window.renderRunnerPortrait = (id) => {
        const definition = CHARACTERS.find((item) => item.id === id);
        if (!definition) throw new Error(`Unknown runner: ${id}`);
        const visual = createSchoolboy(definition);
        visual.rotation.y = Math.PI;
        visual.userData.joints.leftArm.rotation.x = -0.14;
        visual.userData.joints.rightArm.rotation.x = 0.14;
        visual.userData.joints.leftElbow.rotation.x = -0.24;
        visual.userData.joints.rightElbow.rotation.x = -0.24;
        scene.add(visual);
        visual.updateMatrixWorld(true);
        renderer.render(scene, camera);
        const data = renderer.domElement.toDataURL('image/png');
        visual.removeFromParent();
        disposeBatchedGeometry(visual);
        renderer.renderLists.dispose();
        return data;
      };
      window.runnerPortraitIds = CHARACTERS.map((item) => item.id);
      window.runnerPortraitsReady = true;
    </script>
  </body>
</html>
